name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      LUA_PATH: "lua/?.lua;lua/?/init.lua;;"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Busted
        uses: lunarmodules/busted@v2
