name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Validate main PR source
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests from forks must target dev."
            exit 1
          fi

          case "$HEAD_REF" in
            dev|hotfix/*) ;;
            *)
              echo "::error::Pull requests to main must come from dev or hotfix/*."
              exit 1
              ;;
          esac
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6
      - name: Install Busted
        run: luarocks install busted 2.3.0
      - name: Run tests
        run: make test

  stylua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install StyLua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.5.2
      - name: Check formatting
        run: make lint-stylua

  selene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Selene
        uses: taiki-e/install-action@v2
        with:
          tool: selene@0.31.0
      - name: Check Lua
        run: make lint-selene
