name: Auto Assign

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  assign:
    name: Assign maintainer
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign maintainer and request review
        uses: actions/github-script@v9
        with:
          script: |
            const maintainer = "emrearmagan"
            const { owner, repo } = context.repo
            const issueNumber = context.issue.number

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: [maintainer],
            })

            const pullRequest = context.payload.pull_request

            if (!pullRequest) {
              return
            }

            if (pullRequest.draft) {
              core.info("Skipping review request for a draft pull request")
              return
            }

            if (pullRequest.user.login === maintainer) {
              core.info("Skipping review request for the maintainer's own pull request")
              return
            }

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: issueNumber,
              reviewers: [maintainer],
            })
