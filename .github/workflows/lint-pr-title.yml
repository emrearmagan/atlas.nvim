name: Lint PR Title

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
